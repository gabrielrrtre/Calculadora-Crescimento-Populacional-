<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crescimento Populacional</title>
  <link rel="stylesheet" href="estilo2.css"> 
</head>
<body>
  <div class="container">
    <h1>Cálculo de Crescimento Populacional</h1>
    
    <label for="popInicial">População Inicial:</label>
    <input type="number" id="popInicial" placeholder="Ex: 1000">
    
    <label for="taxa">Taxa de Crescimento (% ao ano):</label>
    <input type="number" id="taxa" placeholder="Ex: 2">
    
    <label for="anos">Número de Anos:</label>
    <input type="number" id="anos" placeholder="Ex: 10">
    
    <button id="calcular">Calcular</button>
    
    <h2>Resultado:</h2>
    <div id="resultado"></div>
  </div>
  
  <script src="arquivo.js"></script> 
</body>
</html>
